<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta | Adoración Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-blue: #0a192f;
            --light-blue: #112240;
            --gold: #c5a059;
            --text-gray: #a8b2d1;
        }

        body {
            background-color: var(--dark-blue);
            color: white;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .form-container {
            background: var(--light-blue);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-top: 4px solid var(--gold);
            align-self: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header img {
            width: 100px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.2));
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.8rem;
            margin: 0;
        }

        .question-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--dark-blue);
            border: 1px solid #233554;
            border-radius: 8px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--gold);
        }

        .rating-group {
            display: flex;
            justify-content: space-between;
            background: var(--dark-blue);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #233554;
        }

        .rating-option {
            text-align: center;
            font-size: 0.8rem;
        }

        .rating-option input {
            display: block;
            margin: 8px auto 0;
            cursor: pointer;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .btn-submit {
            background: var(--gold);
            color: var(--dark-blue);
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            background: #e2be7a;
            box-shadow: 0 10px 20px rgba(197, 160, 89, 0.3);
        }

        .btn-submit:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-gray);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="header">
            <img src="https://i.ibb.co/fzzW4BxH/logo.png" alt="Logo Adoración Viva">
            <h1>Tu Opinión Cuenta</h1>
        </div>

        <form id="encuestaForm">
            <!-- Nombre -->
            <div class="question-group">
                <label for="nombre">Nombre Completo (Opcional)</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre si deseas...">
            </div>

            <!-- Área -->
            <div class="question-group">
                <label for="area">¿En qué área de la academia participas?</label>
                <select id="area" required>
                    <option value="">Selecciona una opción</option>
                    <option value="Música">Música / Instrumentos</option>
                    <option value="Danza">Danza / Expresión Corporal</option>
                    <option value="Teatro">Teatro</option>
                    <option value="Artes">Artes Visuales</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <!-- Calificación -->
            <div class="question-group">
                <label>¿Cómo calificarías tu experiencia general? (1 al 5)</label>
                <div class="rating-group">
                    <div class="rating-option">Mala<input type="radio" name="calif" value="1" required></div>
                    <div class="rating-option">Regular<input type="radio" name="calif" value="2"></div>
                    <div class="rating-option">Buena<input type="radio" name="calif" value="3"></div>
                    <div class="rating-option">Muy Buena<input type="radio" name="calif" value="4"></div>
                    <div class="rating-option">Excelente<input type="radio" name="calif" value="5"></div>
                </div>
            </div>

            <!-- Lo que gusta -->
            <div class="question-group">
                <label for="comentarios">¿Qué es lo que más te gusta de la academia?</label>
                <textarea id="comentarios" placeholder="Cuéntanos tu parte favorita..."></textarea>
            </div>

            <!-- Sugerencias -->
            <div class="question-group">
                <label for="sugerencias">¿Qué podríamos mejorar?</label>
                <textarea id="sugerencias" placeholder="Tus sugerencias nos ayudan a crecer..."></textarea>
            </div>

            <button type="submit" id="btnEnviar" class="btn-submit">ENVIAR ENCUESTA</button>
        </form>

        <div class="footer-note">
            Academia Adoración Viva &copy; 2026
        </div>
    </div>

    <!-- CONEXIÓN A FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9t_0J5Ttsz70SeeiKyQ5tI-6LEA2J9_g",
            authDomain: "academia-encuesta.firebaseapp.com",
            projectId: "academia-encuesta",
            storageBucket: "academia-encuesta.firebasestorage.app",
            messagingSenderId: "241229580560",
            appId: "1:241229580560:web:0683886eae98bfc9f17d95",
            measurementId: "G-2G791B45JW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('encuestaForm');
        const btn = document.getElementById('btnEnviar');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Bloquear botón para evitar doble envío
            btn.disabled = true;
            btn.innerText = "PROCESANDO...";

            const datos = {
                nombre: document.getElementById('nombre').value || "Anónimo",
                area: document.getElementById('area').value,
                calificacion: document.querySelector('input[name="calif"]:checked').value,
                comentarios: document.getElementById('comentarios').value,
                sugerencias: document.getElementById('sugerencias').value,
                fecha: serverTimestamp()
            };

            try {
                // Guardar en Firestore
                await addDoc(collection(db, "encuestas"), datos);
                
                alert("¡Gracias! Tu voz ha sido escuchada. Dios te bendiga.");
                window.location.href = "index.html"; // Regresar al inicio
            } catch (error) {
                console.error("Error al enviar:", error);
                alert("Ocurrió un error al enviar. Inténtalo de nuevo.");
                btn.disabled = false;
                btn.innerText = "ENVIAR ENCUESTA";
            }
        });
    </script>
</body>
</html>
