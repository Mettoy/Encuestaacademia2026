<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Satisfacción | Adoración Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --dark-blue: #0a192f; --light-blue: #112240; --gold: #c5a059; --text-gray: #a8b2d1; }
        body { background-color: var(--dark-blue); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: var(--light-blue); max-width: 700px; width: 100%; padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-top: 4px solid var(--gold); }
        .header { text-align: center; margin-bottom: 40px; }
        .header img { width: 100px; margin-bottom: 15px; }
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem; margin: 0; }
        .section-title { color: var(--gold); border-bottom: 1px solid rgba(197, 160, 89, 0.3); margin: 30px 0 15px; padding-bottom: 5px; font-size: 1.1rem; text-transform: uppercase; }
        .question-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.9rem; }
        input[type="text"], select, textarea { width: 100%; padding: 12px; background: var(--dark-blue); border: 1px solid #233554; border-radius: 8px; color: white; font-family: 'Montserrat', sans-serif; box-sizing: border-box; outline: none; }
        .hidden-reason { display: none; margin-top: 10px; }
        .radio-group { display: flex; gap: 20px; background: var(--dark-blue); padding: 10px; border-radius: 8px; border: 1px solid #233554; }
        .btn-submit { background: var(--gold); color: var(--dark-blue); width: 100%; padding: 15px; border: none; border-radius: 50px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 30px; text-transform: uppercase; }
        .btn-submit:hover { transform: translateY(-3px); background: #e2be7a; box-shadow: 0 10px 20px rgba(197, 160, 89, 0.3); }
        .btn-submit:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <img src="https://i.ibb.co/fzzW4BxH/logo.png" alt="Logo">
        <h1>Encuesta de Satisfacción</h1>
    </div>

    <form id="encuestaForm">
        <!-- DATOS BÁSICOS -->
        <div class="question-group">
            <label>Instrumento</label>
            <select id="instrumento" required>
                <option value="">Selecciona tu instrumento...</option>
                <option>Piano</option><option>Guitarra Acústica</option><option>Guitarra Eléctrica</option>
                <option>Canto</option><option>Batería</option><option>Violín</option><option>Bajo</option>
                <option>Iniciación Musical</option>
            </select>
        </div>

        <div class="question-group">
            <label>Horario</label>
            <select id="horario" required>
                <option value="">Selecciona tu horario...</option>
                <option>8:00 AM a 10:00 AM</option><option>9:00 AM a 11:00 AM</option>
                <option>10:00 AM a 12:00 PM</option><option>1:00 PM a 3:00 PM</option>
                <option>2:00 PM a 4:00 PM</option><option>3:00 PM a 5:00 PM</option>
            </select>
        </div>

        <!-- SECCIÓN INSTRUMENTO -->
        <div class="section-title">Sobre tu Instrumento</div>
        
        <div class="question-group">
            <label>1. ¿Del 1 al 10 qué te ha parecido la enseñanza de tu instrumento?</label>
            <select id="ensenanza_instrumento" required>
                <option value="">Nota...</option>
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
            </select>
        </div>

        <div class="question-group">
            <label>2. ¿Sientes que has aprendido algo en el transcurso de tiempo estudiado?</label>
            <div class="radio-group">
                <label><input type="radio" name="aprendio_instrumento" value="Si" onclick="document.getElementById('reason2').style.display='none'" required> Sí</label>
                <label><input type="radio" name="aprendio_instrumento" value="No" onclick="document.getElementById('reason2').style.display='block'"> No</label>
            </div>
            <div id="reason2" class="hidden-reason">
                <textarea id="aprendio_instrumento_porque" placeholder="Cuéntanos por qué..."></textarea>
            </div>
        </div>

        <div class="question-group">
            <label>3. ¿Te sientes cómodo/a con el Maestro que te imparte tu instrumento?</label>
            <div class="radio-group">
                <label><input type="radio" name="comodo_maestro" value="Si" required> Sí</label>
                <label><input type="radio" name="comodo_maestro" value="No"> No</label>
            </div>
        </div>

        <div class="question-group">
            <label>4. Quién es tu maestro de instrumento</label>
            <select id="maestro_instrumento" required>
                <option value="">Selecciona profesor...</option>
                <option>Prof. Hilde</option><option>Prof. Meyling</option><option>Prof. Oscar</option>
                <option>Prof. Peter</option><option>Prof. Edwing</option><option>Prof. Melky</option>
                <option>Prof. Rebeca</option><option>Prof. Abraham</option><option>Prof. George</option>
                <option>Prof. Elias</option><option>Prof. Valeska</option><option>Prof. María Elena</option>
                <option>Prof. Erik</option>
            </select>
        </div>

        <div class="question-group">
            <label>5. ¿Qué mejorarías de tu curso o maestro?</label>
            <textarea id="mejorar_maestro" required placeholder="Escribe aquí..."></textarea>
        </div>

        <!-- SECCIÓN SOLFEO -->
        <div class="section-title">Sobre Solfeo</div>

        <div class="question-group">
            <label>6. ¿Del 1 al 10 qué tal te ha parecido la enseñanza de Solfeo?</label>
            <select id="ensenanza_solfeo" required>
                <option value="">Nota...</option>
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
            </select>
        </div>

        <div class="question-group">
            <label>7. ¿Sientes que has aprendido en el transcurso estudiado?</label>
            <div class="radio-group">
                <label><input type="radio" name="aprendio_solfeo" value="Si" onclick="document.getElementById('reason7').style.display='none'" required> Sí</label>
                <label><input type="radio" name="aprendio_solfeo" value="No" onclick="document.getElementById('reason7').style.display='block'"> No</label>
            </div>
            <div id="reason7" class="hidden-reason">
                <textarea id="aprendio_solfeo_porque" placeholder="¿Por qué?"></textarea>
            </div>
        </div>

        <div class="question-group">
            <label>8. ¿Te sientes cómodo con el docente que te imparte solfeo?</label>
            <div class="radio-group">
                <label><input type="radio" name="comodo_solfeo" value="Si" onclick="document.getElementById('reason8').style.display='none'" required> Sí</label>
                <label><input type="radio" name="comodo_solfeo" value="No" onclick="document.getElementById('reason8').style.display='block'"> No</label>
            </div>
            <div id="reason8" class="hidden-reason">
                <textarea id="comodo_solfeo_porque" placeholder="¿Por qué?"></textarea>
            </div>
        </div>

        <div class="question-group">
            <label>9. ¿Quién es tu profesor de Solfeo?</label>
            <select id="maestro_solfeo" required>
                <option value="">Selecciona profesor...</option>
                <option>Prof. Peter</option><option>Prof. Melky</option><option>Prof. Rebeca</option>
                <option>Prof. Valeska</option><option>Prof. María Elena</option>
            </select>
        </div>

        <div class="question-group">
            <label>10. Dinos qué te gustaría que hiciéramos para mejorar</label>
            <textarea id="mejorar_general" required placeholder="Queremos escucharte..."></textarea>
        </div>

        <button type="submit" id="btnEnviar" class="btn-submit">GUARDAR ENCUESTA</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9t_0J5Ttsz70SeeiKyQ5tI-6LEA2J9_g",
        authDomain: "academia-encuesta.firebaseapp.com",
        projectId: "academia-encuesta",
        storageBucket: "academia-encuesta.firebasestorage.app",
        messagingSenderId: "241229580560",
        appId: "1:241229580560:web:0683886eae98bfc9f17d95",
        measurementId: "G-2G791B45JW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('encuestaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "GUARDANDO...";

        // Captura de datos sincronizada con Resultados.html
        const datos = {
            instrumento: document.getElementById('instrumento').value,
            horario: document.getElementById('horario').value,
            ensenanza_instrumento: document.getElementById('ensenanza_instrumento').value,
            aprendio_instrumento: document.querySelector('input[name="aprendio_instrumento"]:checked').value,
            aprendio_instrumento_porque: document.getElementById('aprendio_instrumento_porque').value || "",
            comodo_maestro: document.querySelector('input[name="comodo_maestro"]:checked').value,
            maestro_instrumento: document.getElementById('maestro_instrumento').value,
            mejorar_maestro: document.getElementById('mejorar_maestro').value,
            ensenanza_solfeo: document.getElementById('ensenanza_solfeo').value,
            aprendio_solfeo: document.querySelector('input[name="aprendio_solfeo"]:checked').value,
            aprendio_solfeo_porque: document.getElementById('aprendio_solfeo_porque').value || "",
            comodo_solfeo: document.querySelector('input[name="comodo_solfeo"]:checked').value,
            comodo_solfeo_porque: document.getElementById('comodo_solfeo_porque').value || "",
            maestro_solfeo: document.getElementById('maestro_solfeo').value,
            mejorar_general: document.getElementById('mejorar_general').value,
            fecha: serverTimestamp()
        };

        try {
            await addDoc(collection(db, "encuestas"), datos);
            alert("¡Encuesta guardada con éxito! Dios te bendiga.");
            window.location.href = "index.html";
        } catch (error) {
            console.error("Error:", error);
            alert("Error al conectar con Firebase. Revisa las reglas de seguridad.");
            btn.disabled = false;
            btn.innerText = "GUARDAR ENCUESTA";
        }
    });
</script>

</body>
</html>
