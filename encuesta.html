<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Académica | Adoración Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --dark-blue: #0a192f; --light-blue: #112240; --gold: #c5a059; --text-gray: #a8b2d1; }
        body { background-color: var(--dark-blue); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: var(--light-blue); max-width: 800px; width: 100%; padding: 40px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border-top: 5px solid var(--gold); }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin: 0; }
        .section-title { color: var(--gold); border-bottom: 1px solid rgba(197, 160, 89, 0.3); margin: 30px 0 15px; padding-bottom: 10px; text-transform: uppercase; font-size: 1rem; }
        .rating-row { display: flex; justify-content: space-between; align-items: center; background: rgba(10, 25, 47, 0.5); padding: 10px 15px; margin-bottom: 5px; border-radius: 10px; }
        .options { display: flex; gap: 5px; }
        .radio-btn { appearance: none; width: 30px; height: 30px; border: 2px solid #233554; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .radio-btn::before { content: attr(data-val); color: var(--text-gray); font-size: 0.8rem; font-weight: bold; }
        .radio-btn:checked { background: var(--gold); border-color: var(--gold); }
        .radio-btn:checked::before { color: var(--dark-blue); }
        select, textarea { width: 100%; padding: 12px; background: var(--dark-blue); border: 1px solid #233554; border-radius: 10px; color: white; margin-bottom: 15px; font-family: inherit; }
        .btn-submit { background: var(--gold); color: var(--dark-blue); width: 100%; padding: 18px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 20px; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <h1>Evaluación de Desempeño</h1>
        <p style="color: var(--gold)">Academia Adoración Viva</p>
    </div>

    <form id="evaluacionForm">
        <label>Selecciona tu Curso</label>
        <select id="curso" required>
            <option value="">-- Seleccionar --</option>
            <option>Piano</option><option>Guitarra Acústica</option><option>Guitarra Eléctrica</option>
            <option>Canto</option><option>Batería</option><option>Violín</option><option>Bajo</option>
        </select>

        <!-- SECCIÓN INSTRUMENTO -->
        <div class="section-title">1. Sobre el Curso de Instrumento</div>
        <div class="rating-row"><span>Organización</span><div class="options" data-group="inst_org"></div></div>
        <div class="rating-row"><span>Calidad del Contenido</span><div class="options" data-group="inst_cal"></div></div>
        <div class="rating-row"><span>Ejercicios Prácticos</span><div class="options" data-group="inst_prac"></div></div>

        <label style="margin-top:15px; display:block;">Docente de Instrumento</label>
        <select id="docente_inst" required>
            <option value="">-- Seleccionar Maestro --</option>
            <option>Prof. Hilde</option><option>Prof. Meyling</option><option>Prof. Oscar</option><option>Prof. Peter</option>
            <option>Prof. Edwing</option><option>Prof. Melky</option><option>Prof. Rebeca</option><option>Prof. Abraham</option>
        </select>
        <div class="rating-row"><span>Claridad del Maestro</span><div class="options" data-group="doc_inst_clar"></div></div>

        <!-- SECCIÓN SOLFEO -->
        <div class="section-title">2. Sobre el Curso de Solfeo</div>
        <label>Docente de Solfeo</label>
        <select id="docente_solfeo" required>
            <option value="">-- Seleccionar Maestro --</option>
            <option>Prof. Peter</option><option>Prof. Melky</option><option>Prof. Rebeca</option><option>Prof. Valeska</option>
        </select>
        <div class="rating-row"><span>Claridad en Solfeo</span><div class="options" data-group="sol_clar"></div></div>
        <div class="rating-row"><span>Utilidad de los Temas</span><div class="options" data-group="sol_tem"></div></div>

        <!-- COMENTARIOS -->
        <div class="section-title">3. Opiniones Finales</div>
        <label>¿Qué fue lo que más te gustó?</label>
        <textarea id="mejor_inst" rows="3" required></textarea>

        <label>¿Qué sugerencia nos darías para mejorar?</label>
        <textarea id="mejorar_inst" rows="3" required></textarea>

        <button type="submit" id="btnEnviar" class="btn-submit">GUARDAR EVALUACIÓN</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9t_0J5Ttsz70SeeiKyQ5tI-6LEA2J9_g",
        authDomain: "academia-encuesta.firebaseapp.com",
        projectId: "academia-encuesta",
        storageBucket: "academia-encuesta.firebasestorage.app",
        messagingSenderId: "241229580560",
        appId: "1:241229580560:web:0683886eae98bfc9f17d95",
        measurementId: "G-2G791B45JW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Generar radio buttons dinámicamente para ahorrar espacio en código
    document.querySelectorAll('.options').forEach(div => {
        const name = div.getAttribute('data-group');
        for (let i = 1; i <= 5; i++) {
            div.innerHTML += `<input type="radio" name="${name}" value="${i}" data-val="${i}" class="radio-btn" required>`;
        }
    });

    document.getElementById('evaluacionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "PROCESANDO...";

        const getRadio = (name) => document.querySelector(`input[name="${name}"]:checked`).value;

        const ticket = {
            curso: document.getElementById('curso').value,
            inst_organizacion: getRadio('inst_org'),
            inst_calidad: getRadio('inst_cal'),
            inst_practica: getRadio('inst_prac'),
            docente_instrumento: document.getElementById('docente_inst').value,
            doc_inst_claridad: getRadio('doc_inst_clar'),
            docente_solfeo: document.getElementById('docente_solfeo').value,
            sol_claridad: getRadio('sol_clar'),
            sol_temas: getRadio('sol_tem'),
            mejor_instrumento: document.getElementById('mejor_inst').value,
            mejorar_instrumento: document.getElementById('mejorar_inst').value,
            fecha: serverTimestamp()
        };

        try {
            await addDoc(collection(db, "evaluaciones"), ticket);
            alert("¡Muchas gracias! Tu evaluación se guardó con éxito.");
            window.location.href = "index.html";
        } catch (error) {
            console.error(error);
            alert("Error de conexión. Intenta de nuevo.");
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
