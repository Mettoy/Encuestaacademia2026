<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        /* --- CONFIGURACIÓN GENERAL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #0d1b2a, #000814);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- FONDO DE CONFETI ANIMADO --- */
        .confetti-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            border-radius: 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .card-wrapper {
            position: relative;
            width: 380px;
            height: 500px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- EL SOBRE VITUAL (PANTALLA 1) --- */
        .envelope {
            position: absolute;
            width: 100%;
            height: 300px;
            background: #0056b3;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: transform 0.8s ease, opacity 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Solapa del sobre */
        .envelope::before {
            content: '';
            position: absolute;
            top: -160px;
            left: 0;
            border-left: 190px solid transparent;
            border-right: 190px solid transparent;
            border-bottom: 160px solid #0056b3;
            transform-origin: bottom;
            transition: transform 0.6s ease 0.2s;
            z-index: 3;
        }

        /* Sello dorado */
        .seal {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border-radius: 50%;
            position: absolute;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000814;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
            transition: transform 0.4s ease;
        }

        .envelope:hover .seal {
            transform: scale(1.1);
        }

        /* --- ESTADO ABIERTO (ANIMACIÓN DEL SOBRE) --- */
        .card-wrapper.open .envelope::before {
            transform: rotateX(180deg) translateY(2px);
            z-index: 1;
        }

        .card-wrapper.open .envelope {
            transform: translateY(300px);
            opacity: 0;
            pointer-events: none;
        }

        /* --- LA TARJETA INTERIOR (PANTALLA 2) --- */
        .actual-card {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 20px;
            border: 4px solid #ffd700;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            opacity: 0;
            transform: scale(0.8) translateY(-100px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .card-wrapper.open .actual-card {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* --- CONTENIDO DE LA TARJETA --- */
        .title {
            color: #0056b3;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        .divider {
            height: 3px;
            background: linear-gradient(to right, transparent, #ffd700, transparent);
            margin: 15px 0;
        }

        .message {
            color: #333;
            font-size: 1.05rem;
            line-height: 1.6;
            font-style: italic;
        }

        /* Galería de imágenes pequeña / interactiva */
        .photo-holder {
            width: 100%;
            height: 160px;
            background: #eef1f6;
            border-radius: 12px;
            margin: 15px 0;
            overflow: hidden;
            border: 2px dashed #0056b3;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-holder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-holder:hover img {
            transform: scale(1.1) rotate(2deg);
        }

        /* Botón de acción elegante */
        .btn-action {
            background: linear-gradient(135deg, #0056b3, #004085);
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 86, 179, 0.4);
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 86, 179, 0.6);
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000814;
        }

        /* --- CLASES DE ANIMACIÓN --- */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 10px rgba(255,215,0,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 4px 20px rgba(255,215,0,0.8); }
            100% { transform: scale(1); box-shadow: 0 4px 10px rgba(255,215,0,0.4); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <!-- Capa de Confeti -->
    <div class="confetti-container" id="confetti-bg"></div>

    <!-- Contenedor de la Tarjeta -->
    <div class="card-wrapper" id="main-container">
        
        <!-- El Sobre (Pantalla de inicio) -->
        <div class="envelope" onclick="openCard()">
            <div class="seal">✨</div>
        </div>

        <!-- La Tarjeta Real -->
        <div class="actual-card">
            <div>
                <h1 class="title">¡Felicidades!</h1>
                <div class="divider"></div>
                <p class="message">"Hoy celebramos tu vida, tus éxitos y la increíble persona que eres. Que este nuevo año esté lleno de momentos brillantes, sonrisas y metas cumplidas."</p>
            </div>

            <!-- Espacio para foto (Puedes cambiar el src por la foto que desees) -->
            <div class="photo-holder">
                <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=500&q=80" alt="Celebración">
            </div>

            <div>
                <button class="btn-action" onclick="celebrateMore()">¡Celebrar!</button>
            </div>
        </div>
    </div>

    <script>
        // Generador automático de confeti elegante (tonos dorados y blancos)
        const confettiContainer = document.getElementById('confetti-bg');
        const colors = ['#ffd700', '#ffffff', '#e6c300', '#f4f4f9'];

        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDelay = Math.random() * 5 + 's';
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            // Tamaños variados para dar profundidad
            const size = Math.random() * 8 + 6 + 'px';
            confetti.style.width = size;
            confetti.style.height = size;
            confettiContainer.appendChild(confetti);
        }

        // Función para abrir el sobre
        function openCard() {
            document.getElementById('main-container').classList.add('open');
        }

        // Efecto extra al presionar el botón de la tarjeta
        function celebrateMore() {
            // Duplica la intensidad del confeti por un momento
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const extraConfetti = document.createElement('div');
                    extraConfetti.classList.add('confetti');
                    extraConfetti.style.left = Math.random() * 100 + 'vw';
                    extraConfetti.style.top = '-20px';
                    extraConfetti.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                    extraConfetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confettiContainer.appendChild(extraConfetti);
                    
                    // Limpieza para no sobrecargar el navegador
                    setTimeout(() => extraConfetti.remove(), 2500);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
