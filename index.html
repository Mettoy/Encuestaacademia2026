<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cumpleaños Sorpresa</title>
    <style>
        /* --- CONFIGURACIÓN DE LUJO --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #020813 0%, #071930 50%, #0a2246 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* --- PARTÍCULAS DE LUZ AUTOMÁTICAS --- */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 86, 179, 0.2) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            animation: drift 15s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(200px, 100px) scale(1.2); }
        }

        /* --- CONTENEDOR PRINCIPAL PREMIUM --- */
        .luxury-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 215, 0, 0.4); /* Línea sutil dorada superior */
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            
            /* Animación de entrada automática */
            opacity: 0;
            transform: translateY(40px);
            animation: revealCard 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes revealCard {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- CONTENEDOR DE LA FOTO --- */
        .photo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #ffd700, #b8860b, transparent);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: scale(0.7);
            animation: revealPhoto 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #071930;
            transition: transform 0.6s ease;
        }

        .photo-container:hover img {
            transform: scale(1.05);
        }

        @keyframes revealPhoto {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* --- TIPOGRAFÍA Y TEXTOS --- */
        .tagline {
            color: #ffd700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            font-weight: 600;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.6s;
        }

        .main-title {
            color: #ffffff;
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.8s;
        }

        .main-title span {
            background: linear-gradient(135deg, #ffffff 30%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .divider {
            width: 50px;
            height: 2px;
            background: #ffd700;
            margin: 0 auto 25px auto;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.9s;
        }

        .description {
            color: #a0aec0;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 35px;
            font-weight: 300;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 1s;
        }

        /* --- BOTÓN DE WHATSAPP ELEGANTE --- */
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #ffffff;
            color: #020813;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn id 0.8s ease forwards 1.2s;
        }

        /* Efecto destello de luz interno */
        .btn-whatsapp::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.4), transparent);
            transition: 0.5s;
        }

        .btn-whatsapp:hover::before {
            left: 100%;
            transition: 0.6s;
        }

        .btn-whatsapp:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.2);
            background: #ffd700;
            color: #020813;
        }

        /* Icono de verificación limpio */
        .btn-whatsapp svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* --- ANIMACIONES ADICIONALES --- */
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Resplandor ambiental de fondo -->
    <div class="ambient-glow"></div>

    <!-- Tarjeta Principal -->
    <div class="luxury-card">
        
        <!-- Contenedor para tu Foto Reemplazable -->
        <div class="photo-container">
            <!-- Nota: Reemplaza este enlace por la URL de tu fotografía final -->
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80" alt="Mi Foto">
        </div>

        <!-- Textos Conceptuales -->
        <p class="tagline">Estás Invitado</p>
        <h1 class="main-title">Mi Cumpleaños<br><span>Sorpresa</span></h1>
        
        <div class="divider"></div>
        
        <p class="description">
            Hay momentos que merecen ser celebrados en grande y con las personas que hacen la vida especial. Te espero para compartir una noche exclusiva llena de misterio, elegancia y buena música.
        </p>

        <!-- Botón de Confirmación Directo a WhatsApp -->
        <!-- Nota: Cambia el número '50512345678' por tu número real con código de área -->
        <a href="https://wa.me/50512345678?text=%C2%A1Hola!%20Confirmo%20mi%20asistencia%20a%20tu%20Cumplea%C3%B1os%20Sorpresa.%20%C2%A1Ah%C3%AD%20estar%C3%A9!" class="btn-whatsapp" target="_blank">
            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.498 1.451 5.42 1.453 5.441 0 9.864-4.42 9.868-9.863.002-2.637-1.023-5.116-2.884-6.98C17.169 1.898 14.7 1.87 12.01 1.87c-5.443 0-9.866 4.422-9.87 9.865-.001 1.948.506 3.848 1.47 5.466l-.933 3.409 3.49-.916z"/>
            </svg>
            Confirmar Asistencia
        </a>

    </div>

</body>
</html>
