<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta | Academia Adoración Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --dark: #1b2631;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark);
            background-image: radial-gradient(circle at center, #2c3e50 0%, #1b2631 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            padding: 50px 30px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container img {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #d5dbdb;
            margin-bottom: 35px;
        }

        .btn-start {
            background: var(--gold);
            color: var(--dark);
            padding: 18px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 10px 20px rgba(197, 160, 89, 0.3);
            outline: none;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            background: #e2be7a;
            box-shadow: 0 15px 25px rgba(197, 160, 89, 0.4);
        }

        .footer-text {
            margin-top: 30px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <!-- Logo configurado -->
            <img src="https://i.ibb.co/fzzW4BxH/logo.png" alt="Logo Adoración Viva">
        </div>
        
        <h1>Adoración Viva</h1>
        <p>Tu voz es parte de nuestra armonía. Haz clic en el botón para comenzar la encuesta mientras escuchas nuestra música.</p>

        <!-- Botón de acción -->
        <button class="btn-start" onclick="iniciarExperiencia()">COMENZAR ENCUESTA</button>

        <div class="footer-text">Academia de Artes Escénicas</div>
    </div>

    <!-- AUDIO configurado con enlace directo de Dropbox -->
    <audio id="bgMusic" loop>
        <source src="https://www.dropbox.com/scl/fi/c3o4j1tg1mxge0glgikqj/Glorioso-d-a-Glorious-Day-Passion-Ft.-Kristian-Stanfill-En-Esp-ol-Letra-Pista-M4A_128K.m4a?rlkey=asyz5vw3he62l02qy1j9cpvjx&st=wklkousf&raw=1" type="audio/mp4">
    </audio>

    <script>
        function iniciarExperiencia() {
            // Reproducir música
            var musica = document.getElementById("bgMusic");
            musica.play();

            // Abrir encuesta (REEMPLAZA ESTE LINK POR TU GOOGLE FORMS)
            setTimeout(function() {
                window.open("https://docs.google.com/forms/d/e/TU_ID_AQUI/viewform", "_blank");
            }, 600);
        }
    </script>

</body>
</html>
