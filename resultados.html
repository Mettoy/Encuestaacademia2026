<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Adoración Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --dark-blue: #0a192f; --light-blue: #112240; --gold: #c5a059; }
        body { background-color: var(--dark-blue); color: white; font-family: 'Montserrat', sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold); padding-bottom: 20px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--light-blue); padding: 20px; border-radius: 15px; border: 1px solid rgba(197,160,89,0.2); }
        .table-wrapper { background: var(--light-blue); border-radius: 15px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
        th { color: var(--gold); text-transform: uppercase; }
        .badge { background: var(--gold); color: var(--dark-blue); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .time { font-size: 0.7rem; color: #a8b2d1; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="color:var(--gold); font-family:'Playfair Display'">Panel de Control</h1>
        <a href="index.html" style="color:white; text-decoration:none; border:1px solid var(--gold); padding:10px 20px; border-radius:50px;">SALIR</a>
    </div>

    <div class="grid">
        <div class="card"><h3>Cursos Activos</h3><canvas id="chart1"></canvas></div>
        <div class="card"><h3>Satisfacción Promedio</h3><canvas id="chart2"></canvas></div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Fecha / Hora</th>
                    <th>Curso / Maestro</th>
                    <th>Evaluación</th>
                    <th>Comentarios</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9t_0J5Ttsz70SeeiKyQ5tI-6LEA2J9_g",
        authDomain: "academia-encuesta.firebaseapp.com",
        projectId: "academia-encuesta",
        storageBucket: "academia-encuesta.firebasestorage.app",
        messagingSenderId: "241229580560",
        appId: "1:241229580560:web:0683886eae98bfc9f17d95",
        measurementId: "G-2G791B45JW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let charts = {};

    onSnapshot(query(collection(db, "evaluaciones"), orderBy("fecha", "desc")), (snap) => {
        const data = [];
        snap.forEach(doc => data.push(doc.data()));
        
        const tabla = document.getElementById('tabla');
        tabla.innerHTML = data.map(d => {
            const f = d.fecha ? d.fecha.toDate() : new Date();
            return `<tr>
                <td>${f.toLocaleDateString()}<span class="time">${f.toLocaleTimeString()}</span></td>
                <td><b>${d.curso}</b><br><small>Prof: ${d.docente_instrumento}</small></td>
                <td>Org: <span class="badge">${d.inst_organizacion}</span> Cal: <span class="badge">${d.inst_calidad}</span></td>
                <td><b>Mejor:</b> ${d.mejor_instrumento}<br><b>Mejorar:</b> ${d.mejorar_instrumento}</td>
            </tr>`;
        }).join('');

        // Gráfica simple
        const cursos = {}; data.forEach(d => cursos[d.curso] = (cursos[d.curso] || 0) + 1);
        renderChart('chart1', 'pie', Object.keys(cursos), Object.values(cursos), 'c1');
    });

    function renderChart(id, type, labels, data, key) {
        if(charts[key]) charts[key].destroy();
        charts[key] = new Chart(document.getElementById(id), {
            type: type, data: { labels: labels, datasets: [{ data: data, backgroundColor: ['#c5a059', '#4a90e2', '#2ecc71'] }] },
            options: { plugins: { legend: { labels: { color: '#fff' } } } }
        });
    }
</script>
</body>
</html>
