<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Académico | Adoración Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --dark-blue: #0a192f; --light-blue: #112240; --gold: #c5a059; --text-gray: #a8b2d1; }
        body { background-color: var(--dark-blue); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin: 0; font-size: 1.5rem; }
        .btn-exit { color: white; text-decoration: none; border: 1px solid var(--gold); padding: 8px 20px; border-radius: 50px; font-size: 0.8rem; transition: 0.3s; font-weight: bold; }
        .btn-exit:hover { background: var(--gold); color: var(--dark-blue); }

        /* Dashboard de Gráficas */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .chart-card { background: var(--light-blue); padding: 20px; border-radius: 15px; border: 1px solid rgba(197,160,89,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .chart-card h3 { color: var(--gold); font-size: 0.9rem; text-align: center; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; }

        /* Tabla de Resultados */
        .table-wrapper { background: var(--light-blue); border-radius: 15px; overflow-x: auto; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; vertical-align: top; }
        th { background: rgba(197, 160, 89, 0.1); color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
        .badge-nota { background: var(--gold); color: var(--dark-blue); padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .teacher-info { color: var(--text-gray); font-style: italic; display: block; margin-top: 4px; }
        .reason-text { color: #e74c3c; font-weight: 600; display: block; margin-top: 5px; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Panel de Control Académico</h1>
        <a href="index.html" class="btn-exit">CERRAR SESIÓN</a>
    </div>

    <!-- SECCIÓN DE MÉTRICAS -->
    <div class="dashboard-grid">
        <div class="chart-card">
            <h3>Alumnos por Instrumento</h3>
            <canvas id="chartInst"></canvas>
        </div>
        <div class="chart-card">
            <h3>Nivel de Aprendizaje (%)</h3>
            <canvas id="chartAprendizaje"></canvas>
        </div>
        <div class="chart-card">
            <h3>Satisfacción con Maestros</h3>
            <canvas id="chartComodidad"></canvas>
        </div>
    </div>

    <!-- TABLA DE DETALLES -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Fecha / Horario</th>
                    <th>Instrumento / Maestro</th>
                    <th>Notas (Inst / Solf)</th>
                    <th>Aprendizaje Detallado</th>
                    <th>Sugerencias y Mejoras</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo">
                <tr><td colspan="5" style="text-align:center; padding: 40px;">Conectando con la base de datos...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9t_0J5Ttsz70SeeiKyQ5tI-6LEA2J9_g",
        authDomain: "academia-encuesta.firebaseapp.com",
        projectId: "academia-encuesta",
        storageBucket: "academia-encuesta.firebasestorage.app",
        messagingSenderId: "241229580560",
        appId: "1:241229580560:web:0683886eae98bfc9f17d95",
        measurementId: "G-2G791B45JW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let charts = {};

    // ESCUCHA EN TIEMPO REAL
    const q = query(collection(db, "encuestas"), orderBy("fecha", "desc"));
    
    onSnapshot(q, (snapshot) => {
        const docs = [];
        snapshot.forEach(doc => docs.push(doc.data()));
        
        actualizarTabla(docs);
        actualizarGraficas(docs);
    });

    function actualizarTabla(data) {
        const cuerpo = document.getElementById('tabla-cuerpo');
        if (data.length === 0) {
            cuerpo.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay respuestas aún.</td></tr>';
            return;
        }

        cuerpo.innerHTML = data.map(d => `
            <tr>
                <td><b>${d.fecha ? d.fecha.toDate().toLocaleDateString() : 'Hoy'}</b><br>${d.horario}</td>
                <td>
                    <b>${d.instrumento}</b>
                    <span class="teacher-info">Maestro: ${d.maestro_instrumento}</span>
                    <span class="teacher-info">Solfeo: ${d.maestro_solfeo}</span>
                </td>
                <td>
                    Inst: <span class="badge-nota">${d.ensenanza_instrumento}</span><br><br>
                    Solf: <span class="badge-nota">${d.ensenanza_solfeo}</span>
                </td>
                <td>
                    <b>Aprendió Inst:</b> ${d.aprendio_instrumento}
                    ${d.aprendio_instrumento === 'No' ? `<span class="reason-text">Motivo: ${d.aprendio_instrumento_porque}</span>` : ''}
                    <br><br>
                    <b>Aprendió Solf:</b> ${d.aprendio_solfeo}
                    ${d.aprendio_solfeo === 'No' ? `<span class="reason-text">Motivo: ${d.aprendio_solfeo_porque}</span>` : ''}
                </td>
                <td>
                    <b>Sobre el curso:</b> ${d.mejorar_maestro}<br><br>
                    <b>General:</b> ${d.mejorar_general}
                </td>
            </tr>
        `).join('');
    }

    function actualizarGraficas(data) {
        // Procesar datos para gráficas
        const instrumentos = {};
        const aprendizaje = { Si: 0, No: 0 };
        const comodidad = { Si: 0, No: 0 };

        data.forEach(d => {
            instrumentos[d.instrumento] = (instrumentos[d.instrumento] || 0) + 1;
            aprendizaje[d.aprendio_instrumento]++;
            comodidad[d.comodo_maestro]++;
        });

        // Gráfica de Instrumentos
        renderChart('chartInst', 'doughnut', Object.keys(instrumentos), Object.values(instrumentos), ['#c5a059', '#112240', '#4a90e2', '#ffffff', '#e74c3c'], 'inst');

        // Gráfica de Aprendizaje
        renderChart('chartAprendizaje', 'pie', ['Aprendió', 'No Aprendió'], [aprendizaje.Si, aprendizaje.No], ['#2ecc71', '#e74c3c'], 'apr');

        // Gráfica de Comodidad
        renderChart('chartComodidad', 'bar', ['Cómodo', 'Incómodo'], [comodidad.Si, comodidad.No], ['#c5a059', '#233554'], 'comod');
    }

    function renderChart(id, type, labels, data, colors, chartKey) {
        if (charts[chartKey]) charts[chartKey].destroy();
        charts[chartKey] = new Chart(document.getElementById(id), {
            type: type,
            data: {
                labels: labels,
                datasets: [{ data: data, backgroundColor: colors, borderWidth: 0 }]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'bottom', labels: { color: '#a8b2d1', font: { size: 10 } } } }
            }
        });
    }
</script>

</body>
</html>
