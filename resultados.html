<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Resultados | Adoración Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --dark-blue: #0a192f; --light-blue: #112240; --gold: #c5a059; --text-gray: #a8b2d1; }
        body { background-color: var(--dark-blue); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin: 0; }
        .btn-back { color: white; text-decoration: none; border: 1px solid white; padding: 8px 15px; border-radius: 5px; font-size: 0.8rem; transition: 0.3s; }
        .btn-back:hover { background: white; color: var(--dark-blue); }

        /* Gráficas */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .chart-card { background: var(--light-blue); padding: 20px; border-radius: 15px; border: 1px solid rgba(197,160,89,0.2); }
        .chart-card h3 { color: var(--gold); font-size: 0.9rem; text-align: center; margin-top: 0; }

        /* Tabla */
        .table-wrapper { background: var(--light-blue); border-radius: 15px; overflow-x: auto; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
        th { background: rgba(197, 160, 89, 0.1); color: var(--gold); text-transform: uppercase; }
        .badge { background: var(--gold); color: var(--dark-blue); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .obs { font-size: 0.75rem; color: var(--text-gray); display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Dashboard Académico</h1>
        <a href="index.html" class="btn-back">SALIR</a>
    </div>

    <!-- SECCIÓN DE GRÁFICAS -->
    <div class="stats-grid">
        <div class="chart-card">
            <h3>Distribución por Instrumento</h3>
            <canvas id="chartInstrumentos"></canvas>
        </div>
        <div class="chart-card">
            <h3>Promedio de Enseñanza (Instrumento)</h3>
            <canvas id="chartNotaInst"></canvas>
        </div>
        <div class="chart-card">
            <h3>Promedio de Enseñanza (Solfeo)</h3>
            <canvas id="chartNotaSolfeo"></canvas>
        </div>
    </div>

    <!-- TABLA DE RESPUESTAS DETALLADAS -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Fecha / Horario</th>
                    <th>Instrumento / Maestro</th>
                    <th>Notas (1-10)</th>
                    <th>Aprendizaje y Comodidad</th>
                    <th>Mejoras y Sugerencias</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo">
                <tr><td colspan="5" style="text-align:center;">Cargando respuestas...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9t_0J5Ttsz70SeeiKyQ5tI-6LEA2J9_g",
        authDomain: "academia-encuesta.firebaseapp.com",
        projectId: "academia-encuesta",
        storageBucket: "academia-encuesta.firebasestorage.app",
        messagingSenderId: "241229580560",
        appId: "1:241229580560:web:0683886eae98bfc9f17d95"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let myCharts = {};

    // Escuchar cambios en tiempo real
    const q = query(collection(db, "encuestas"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
        const data = [];
        snapshot.forEach(doc => data.push(doc.data()));
        renderTabla(data);
        updateCharts(data);
    });

    function renderTabla(data) {
        const cuerpo = document.getElementById('tabla-cuerpo');
        cuerpo.innerHTML = data.map(d => `
            <tr>
                <td>${d.fecha ? d.fecha.toDate().toLocaleDateString() : '---'}<br><small>${d.horario}</small></td>
                <td><strong>${d.instrumento}</strong><br><span class="obs">Prof: ${d.p4}</span></td>
                <td>Inst: <span class="badge">${d.p1}</span><br>Solf: <span class="badge">${d.p6}</span></td>
                <td>
                    <strong>Inst:</strong> ${d.p2} (${d.p2_porque || 'Sin obs'})<br>
                    <strong>Solf:</strong> ${d.p7} (${d.p7_porque || 'Sin obs'})
                </td>
                <td>
                    <strong>Sobre Maestro:</strong> ${d.p5}<br>
                    <strong>General:</strong> ${d.p10}
                </td>
            </tr>
        `).join('');
    }

    function updateCharts(data) {
        // 1. Conteo de instrumentos
        const instCount = {};
        data.forEach(d => instCount[d.instrumento] = (instCount[d.instrumento] || 0) + 1);

        // 2. Promedios
        const avgInst = data.reduce((acc, d) => acc + Number(d.p1), 0) / data.length;
        const avgSolf = data.reduce((acc, d) => acc + Number(d.p6), 0) / data.length;

        // Crear/Actualizar Gráfica Instrumentos
        if (myCharts.inst) myCharts.inst.destroy();
        myCharts.inst = new Chart(document.getElementById('chartInstrumentos'), {
            type: 'pie',
            data: {
                labels: Object.keys(instCount),
                datasets: [{ data: Object.values(instCount), backgroundColor: ['#c5a059', '#112240', '#4a90e2', '#e74c3c', '#2ecc71'] }]
            }
        });

        // Crear/Actualizar Gráfica Notas
        const createBar = (id, label, value, key) => {
            if (myCharts[key]) myCharts[key].destroy();
            myCharts[key] = new Chart(document.getElementById(id), {
                type: 'bar',
                data: {
                    labels: [label],
                    datasets: [{ label: 'Promedio Global', data: [value], backgroundColor: '#c5a059' }]
                },
                options: { scales: { y: { min: 0, max: 10 } } }
            });
        };

        createBar('chartNotaInst', 'Nota Instrumento', avgInst, 'nInst');
        createBar('chartNotaSolfeo', 'Nota Solfeo', avgSolf, 'nSolf');
    }
</script>

</body>
</html>
