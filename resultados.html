
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Académico | Adoración Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --dark-blue: #0a192f; --light-blue: #112240; --gold: #c5a059; --text-gray: #a8b2d1; }
        body { background-color: var(--dark-blue); color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin: 0; font-size: 1.5rem; }
        .btn-exit { color: white; text-decoration: none; border: 1px solid var(--gold); padding: 8px 20px; border-radius: 50px; font-size: 0.8rem; transition: 0.3s; font-weight: bold; }
        .btn-exit:hover { background: var(--gold); color: var(--dark-blue); }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .chart-card { background: var(--light-blue); padding: 20px; border-radius: 15px; border: 1px solid rgba(197,160,89,0.2); }
        .chart-card h3 { color: var(--gold); font-size: 0.9rem; text-align: center; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; }

        .table-wrapper { background: var(--light-blue); border-radius: 15px; overflow-x: auto; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }
        th { background: rgba(197, 160, 89, 0.1); color: var(--gold); text-transform: uppercase; }
        
        .badge-nota { background: var(--gold); color: var(--dark-blue); padding: 3px 8px; border-radius: 5px; font-weight: bold; }
        .timestamp { color: var(--text-gray); font-size: 0.75rem; display: block; }
        .teacher-info { color: var(--gold); font-weight: 600; display: block; margin-top: 5px; }
        .comment-box { font-style: italic; color: #ced4da; font-size: 0.75rem; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 5px; margin-top: 5px; border-left: 2px solid var(--gold); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Dashboard de Resultados | Adoración Viva</h1>
        <a href="index.html" class="btn-exit">VOLVER AL INICIO</a>
    </div>

    <div class="dashboard-grid">
        <div class="chart-card">
            <h3>Distribución por Cursos</h3>
            <canvas id="chartInst"></canvas>
        </div>
        <div class="chart-card">
            <h3>Satisfacción General (1-5)</h3>
            <canvas id="chartSatisfaccion"></canvas>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Curso / Docentes</th>
                    <th>Evaluación Instrumento</th>
                    <th>Evaluación Solfeo</th>
                    <th>Opiniones del Estudiante</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo">
                <tr><td colspan="5" style="text-align:center; padding: 40px;">Cargando evaluaciones...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9t_0J5Ttsz70SeeiKyQ5tI-6LEA2J9_g",
        authDomain: "academia-encuesta.firebaseapp.com",
        projectId: "academia-encuesta",
        storageBucket: "academia-encuesta.firebasestorage.app",
        messagingSenderId: "241229580560",
        appId: "1:241229580560:web:0683886eae98bfc9f17d95",
        measurementId: "G-2G791B45JW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let charts = {};

    const q = query(collection(db, "evaluaciones"), orderBy("fecha", "desc"));
    
    onSnapshot(q, (snapshot) => {
        const docs = [];
        snapshot.forEach(doc => docs.push(doc.data()));
        actualizarTabla(docs);
        actualizarGraficas(docs);
    });

    function actualizarTabla(data) {
        const cuerpo = document.getElementById('tabla-cuerpo');
        if (data.length === 0) {
            cuerpo.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay datos registrados.</td></tr>';
            return;
        }

        cuerpo.innerHTML = data.map(d => {
            // Formatear Fecha y Hora
            const fechaObj = d.fecha ? d.fecha.toDate() : new Date();
            const f_string = fechaObj.toLocaleDateString();
            const h_string = fechaObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return `
                <tr>
                    <td>
                        <b>${f_string}</b>
                        <span class="timestamp">${h_string}</span>
                    </td>
                    <td>
                        <b>${d.curso}</b>
                        <span class="teacher-info">Inst: ${d.docente_instrumento}</span>
                        <span class="teacher-info">Solf: ${d.docente_solfeo}</span>
                    </td>
                    <td>
                        Org: <span class="badge-nota">${d.inst_organizacion}</span> | 
                        Cal: <span class="badge-nota">${d.inst_calidad}</span><br>
                        Prac: <span class="badge-nota">${d.inst_practica}</span> | 
                        Amb: <span class="badge-nota">${d.inst_ambiente}</span>
                    </td>
                    <td>
                        Org: <span class="badge-nota">${d.sol_organizacion}</span> | 
                        Temas: <span class="badge-nota">${d.sol_temas}</span><br>
                        Prac: <span class="badge-nota">${d.sol_practica}</span> | 
                        Amb: <span class="badge-nota">${d.sol_ambiente}</span>
                    </td>
                    <td>
                        <b>Lo mejor:</b>
                        <div class="comment-box">${d.mejor_instrumento}</div>
                        <b>A mejorar:</b>
                        <div class="comment-box">${d.mejorar_instrumento}</div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function actualizarGraficas(data) {
        const cursosCount = {};
        let sumInst = 0, sumSol = 0;

        data.forEach(d => {
            cursosCount[d.curso] = (cursosCount[d.curso] || 0) + 1;
            // Promedio simple de satisfacción por encuesta
            sumInst += (parseInt(d.inst_organizacion) + parseInt(d.inst_calidad) + parseInt(d.inst_practica) + parseInt(d.inst_ambiente)) / 4;
            sumSol += (parseInt(d.sol_organizacion) + parseInt(d.sol_temas) + parseInt(d.sol_practica) + parseInt(d.sol_ambiente)) / 4;
        });

        const avgInst = data.length > 0 ? (sumInst / data.length).toFixed(1) : 0;
        const avgSol = data.length > 0 ? (sumSol / data.length).toFixed(1) : 0;

        renderChart('chartInst', 'pie', Object.keys(cursosCount), Object.values(cursosCount), ['#c5a059', '#112240', '#4a90e2', '#2ecc71', '#e74c3c'], 'c1');
        renderChart('chartSatisfaccion', 'bar', ['Instrumento', 'Solfeo'], [avgInst, avgSol], ['#c5a059', '#a8b2d1'], 'c2');
    }

    function renderChart(id, type, labels, data, colors, key) {
        if (charts[key]) charts[key].destroy();
        charts[key] = new Chart(document.getElementById(id), {
            type: type,
            data: {
                labels: labels,
                datasets: [{ data: data, backgroundColor: colors }]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: type === 'bar' ? { y: { min: 0, max: 5, ticks: { color: '#fff' } }, x: { ticks: { color: '#fff' } } } : {}
            }
        });
    }
</script>
</body>
</html>
